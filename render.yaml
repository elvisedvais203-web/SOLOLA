# Blueprint Render (gratuit) — secrets dans le tableau de bord Render uniquement.
# Repo : https://github.com/elvisedvais203-web/SOLOLA
# Après push : Dashboard Render → Blueprint → Sync / Manual Deploy

databases:
  - name: solola-postgres
    plan: free
    databaseName: solola
    user: solola

services:
  - type: web
    name: solola-frontend
    runtime: node
    plan: free
    rootDir: apps/frontend
    buildCommand: cd ../.. && npm install && npm run build --workspace @nextalk/frontend
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://solola-api.onrender.com/api
      - key: NEXT_PUBLIC_SOCKET_URL
        value: https://solola-api.onrender.com
      - key: API_PROXY_TARGET
        value: https://solola-api.onrender.com
      - key: NEXT_PUBLIC_APP_NAME
        value: Solola
      - key: NEXT_PUBLIC_PUSH_PUBLIC_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        sync: false

  - type: web
    name: solola-api
    runtime: node
    plan: free
    rootDir: apps/backend
    buildCommand: cd ../.. && npm install && npm run build --workspace @nextalk/backend
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: solola-postgres
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGIN
        value: https://solola-frontend.onrender.com
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: MEDIA_PROVIDER
        value: mock
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: WEB_PUSH_VAPID_PUBLIC_KEY
        sync: false
      - key: WEB_PUSH_VAPID_PRIVATE_KEY
        sync: false
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_NAME
        sync: false
      - key: SUPERADMIN_PHONE
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
